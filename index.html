<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dce8f5">
<meta name="description" content="SkiOS, a beautiful web-based desktop experience.">
<title>SkiOS · Your space, reimagined</title>
<style>
:root{color-scheme:light;--ink:#182333;--muted:#68778a;--glass:rgba(250,252,255,.76);--line:rgba(255,255,255,.72);--accent:#4b83e6;--shadow:0 22px 70px #1b36572a,0 3px 12px #14243a12;--wall1:#d8e7f7;--wall2:#b8d1ed;--wall3:#8daee0}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #79a9ff;outline-offset:2px}
body{background:#c5d9ee}.wallpaper{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 18% 18%,#fff9 0,transparent 29%),radial-gradient(ellipse at 80% 25%,#f5fbffad 0,transparent 23%),linear-gradient(145deg,var(--wall1),var(--wall2) 50%,var(--wall3));transition:background .4s}
.wallpaper:before,.wallpaper:after{content:"";position:absolute;border-radius:48%;filter:blur(1px);transform:rotate(-24deg);pointer-events:none}.wallpaper:before{width:78vw;height:92vh;left:34%;top:22%;background:linear-gradient(135deg,#ffffff62,#fff0 58%),linear-gradient(45deg,#6d94d5a6,#b5d4efad 65%,#f9fcffab);box-shadow:inset 2px 2px 30px #fff8,0 0 90px #456eaa19}.wallpaper:after{width:48vw;height:70vh;left:48%;top:40%;background:linear-gradient(130deg,#ffffff80,#f4f9ff20 52%,#5077b83d);border:1px solid #ffffff80;box-shadow:inset 0 0 45px #fff8}
.topbar{height:38px;position:fixed;z-index:1000;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#f9fbffb8;border-bottom:1px solid #ffffffa6;backdrop-filter:blur(24px) saturate(1.4);font-size:12px;font-weight:600}
.top-left,.top-right{display:flex;align-items:center;gap:15px}.brand{font-weight:800;font-size:14px;letter-spacing:-.5px;display:flex;align-items:center;gap:7px}.brand-mark{display:grid;place-items:center;width:20px;height:20px;border-radius:7px;background:linear-gradient(145deg,#78aaf8,#4674ce);color:white;font-size:12px;box-shadow:inset 0 1px 2px #fff8}.menulink{border:0;background:transparent;padding:5px 3px;border-radius:6px;font-size:12px}.menulink:hover{background:#fff9}.status{display:flex;gap:7px;align-items:center;color:#35465a}.status svg{width:15px;height:15px}.desktop{position:fixed;inset:38px 0 78px;padding:22px;z-index:1}
.desktop-icons{position:absolute;top:22px;right:22px;display:grid;grid-template-columns:repeat(2,82px);gap:18px 12px}.desktop-icon{border:0;background:transparent;border-radius:12px;padding:8px 4px;width:82px;display:flex;align-items:center;flex-direction:column;gap:7px;color:#172b46;text-shadow:0 1px 8px #fff9;font-size:11px}.desktop-icon:hover,.desktop-icon:focus-visible{background:#ffffff48;backdrop-filter:blur(6px)}.app-icon{height:47px;width:49px;border-radius:14px;display:grid;place-items:center;color:white;box-shadow:0 8px 16px #29456b20,inset 0 1px #ffffff75}.app-icon svg{width:24px;height:24px;stroke-width:1.7}.blue{background:linear-gradient(145deg,#7bb4ff,#4173db)}.purple{background:linear-gradient(145deg,#b4a2ff,#7962d9)}.mint{background:linear-gradient(145deg,#7fe1ca,#31a994)}.orange{background:linear-gradient(145deg,#ffc887,#f18d58)}.slate{background:linear-gradient(145deg,#9aacc2,#64778e)}.pink{background:linear-gradient(145deg,#ffb8d0,#df6998)}
.welcome{position:absolute;left:5.2%;top:11%;max-width:350px;color:#233954;text-shadow:0 1px 20px #fff8}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:#536d91}.welcome h1{font-size:clamp(35px,4.2vw,57px);line-height:1.02;letter-spacing:-3px;margin:13px 0 12px;font-weight:650}.welcome p{font-size:14px;line-height:1.65;color:#405875;max-width:290px;margin:0}.welcome .date-line{margin-top:24px;font-size:12px;font-weight:650;color:#516b8b}
.dock-wrap{position:fixed;z-index:900;bottom:14px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 22px)}.dock{display:flex;align-items:flex-end;gap:8px;padding:9px 12px 8px;background:#f7faffb8;border:1px solid #ffffffd9;border-radius:22px;backdrop-filter:blur(30px) saturate(1.5);box-shadow:0 12px 45px #1a35532e,inset 0 1px #fff;min-height:76px}.dock-btn{position:relative;border:0;background:transparent;padding:0;width:48px;display:flex;flex-direction:column;align-items:center;gap:6px}.dock-btn .app-icon{width:46px;height:46px;transition:transform .18s cubic-bezier(.2,.8,.2,1);border-radius:14px}.dock-btn:hover .app-icon,.dock-btn:focus-visible .app-icon{transform:translateY(-7px) scale(1.08)}.dock-btn span:last-child{font-size:9px;color:#46566b;font-weight:600}.dock-sep{height:43px;width:1px;background:#74849a36;margin:0 2px 12px}.dot{width:4px;height:4px;background:#4f6d99;border-radius:50%;position:absolute;bottom:-5px}
.window{position:fixed;z-index:100;top:12%;left:50%;transform:translateX(-50%);width:min(760px,calc(100vw - 30px));height:min(540px,calc(100dvh - 150px));min-height:280px;display:flex;flex-direction:column;border:1px solid #ffffffd9;border-radius:15px;background:rgba(250,252,255,.88);backdrop-filter:blur(36px) saturate(1.45);box-shadow:var(--shadow);overflow:hidden;animation:appear .18s ease-out}.window[hidden]{display:none}@keyframes appear{from{opacity:0;transform:translate(-50%,8px) scale(.985)}to{opacity:1;transform:translate(-50%,0) scale(1)}}.titlebar{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #34496712;background:#ffffff55;cursor:grab;user-select:none}.titlebar:active{cursor:grabbing}.window-title{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px}.mini-icon{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;color:white}.mini-icon svg{width:15px;height:15px}.win-controls{display:flex;gap:7px}.win-controls button{width:12px;height:12px;border:0;border-radius:50%;padding:0;background:#e2a04e}.win-controls button:first-child{background:#ef746f}.win-controls button:last-child{background:#65c58b}.window-body{flex:1;overflow:auto;padding:22px}.window-body::-webkit-scrollbar{width:8px}.window-body::-webkit-scrollbar-thumb{background:#9aaabe55;border-radius:8px}
.menu-pop{position:fixed;z-index:1200;top:43px;left:12px;width:235px;padding:7px;background:#f9fbffed;border:1px solid white;border-radius:13px;backdrop-filter:blur(30px);box-shadow:var(--shadow)}.menu-pop[hidden]{display:none}.menu-pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;font-size:12px}.menu-pop button:hover{background:#dce9fa}.menu-pop .menu-rule{height:1px;background:#71839a24;margin:5px}
.search-shell{max-width:460px;margin:10px auto 24px;display:flex;align-items:center;gap:9px;padding:11px 14px;background:#fff;border:1px solid #e1e8f2;border-radius:12px;box-shadow:0 3px 12px #233c5b08}.search-shell input{border:0;outline:none;min-width:0;flex:1;background:transparent;font-size:13px}.search-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.result-card,.settings-card{border:1px solid #e3eaf4;background:#ffffffa8;border-radius:13px;padding:14px}.result-card{cursor:pointer;text-align:left}.result-card:hover{background:white;border-color:#b9cffa}.result-card .app-icon{width:38px;height:38px;margin-bottom:10px}.result-card b{display:block;font-size:12px}.result-card small{font-size:10px;color:var(--muted)}
.section-title{font-size:18px;letter-spacing:-.5px;margin:0 0 6px}.subtle{color:var(--muted);font-size:12px;line-height:1.6}.note-area{width:100%;height:calc(100% - 54px);min-height:180px;resize:none;border:0;outline:none;background:transparent;font-size:14px;line-height:1.8;color:var(--ink)}.notes-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:11px}.primary{border:0;border-radius:9px;background:var(--accent);color:white;padding:9px 13px;font-size:12px;font-weight:650}.secondary{border:1px solid #dbe4f0;background:#fff9;border-radius:9px;padding:8px 11px;font-size:12px}.file-list{display:grid;gap:8px;margin-top:18px}.file-row{display:flex;align-items:center;gap:12px;border:1px solid #e5ebf4;border-radius:11px;padding:12px;background:#fff8}.file-row b{font-size:12px}.file-row small{display:block;color:var(--muted);margin-top:4px;font-size:10px}.calc{max-width:320px;margin:auto}.calc-display{width:100%;height:75px;border:0;background:#ffffffb8;border-radius:12px;text-align:right;padding:15px;font-size:30px;letter-spacing:-1px;color:var(--ink);margin-bottom:12px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-grid button{height:48px;border:1px solid #e0e7f0;background:#ffffffbd;border-radius:11px;font-size:15px}.calc-grid button:hover{background:white}.calc-grid .op{background:#e1ebfb;color:#315fa8}.calc-grid .equal{background:#4b83e6;color:white}.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.settings-card h3{font-size:13px;margin:0 0 8px}.swatches{display:flex;gap:9px;margin-top:12px}.swatch{width:30px;height:30px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #bbc8d9;cursor:pointer}.setting-line{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;margin-top:12px}.switch{width:34px;height:20px;border:0;border-radius:20px;background:#b7c2d1;padding:3px;flex:none}.switch:after{content:"";display:block;width:14px;height:14px;border-radius:50%;background:white;transition:transform .18s}.switch.on{background:#4b83e6}.switch.on:after{transform:translateX(14px)}
.browser-bar{display:flex;gap:8px;margin-bottom:15px}.browser-bar input{min-width:0;flex:1;border:1px solid #dfe7f2;border-radius:9px;background:white;padding:10px;font-size:12px}.browser-content{border:1px solid #e4eaf2;background:#fff;border-radius:12px;min-height:250px;padding:22px}.browser-logo{font-size:27px;font-weight:750;letter-spacing:-1.5px;text-align:center;margin:24px 0 14px}.browser-logo span{color:#4b83e6}.browser-content .search-shell{margin-bottom:12px}.browser-links{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.browser-links button{border:0;background:#f0f5fc;border-radius:8px;padding:8px 10px;font-size:11px}
.toast{position:fixed;z-index:2000;bottom:105px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#19283be8;color:white;border:1px solid #ffffff26;border-radius:10px;font-size:12px;box-shadow:var(--shadow);animation:appear .15s}.toast[hidden]{display:none}.power-screen{position:fixed;z-index:3000;inset:0;background:#15243b;display:grid;place-items:center;color:white;text-align:center}.power-screen[hidden]{display:none}.power-screen button{margin-top:16px}
@media(max-width:600px){.topbar{padding:0 11px}.top-left{gap:8px}.menulink.optional{display:none}.top-right{gap:9px}.desktop{padding:15px}.welcome{top:auto;bottom:8%;left:7%;max-width:75%}.welcome h1{font-size:39px}.welcome p{font-size:12px}.desktop-icons{top:12px;right:10px;grid-template-columns:repeat(2,65px);gap:10px 4px}.desktop-icon{width:65px;font-size:10px}.app-icon{width:43px;height:43px}.dock{gap:5px;padding:8px 9px}.dock-btn{width:39px}.dock-btn .app-icon{width:38px;height:38px;border-radius:12px}.dock-btn span:last-child{font-size:8px}.dock-sep{height:35px}.window{top:9%;height:calc(100dvh - 125px);width:calc(100vw - 18px)}.window-body{padding:16px}.status .hide-small{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wallpaper" id="wallpaper"></div>
<header class="topbar">
 <div class="top-left"><button class="menulink brand" id="systemMenuBtn" aria-label="Open SkiOS menu"><span class="brand-mark">S</span>SkiOS</button><button class="menulink optional" data-open="finder">Finder</button><button class="menulink optional" data-open="settings">Settings</button><button class="menulink optional" data-open="about">About</button></div>
 <div class="top-right"><div class="status" aria-label="System status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 9a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0m-11 3a5 5 0 0 1 8 0m-4 4h.01"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4M5 10h10v4H5z" fill="currentColor" stroke="none"/></svg></div><span id="clock" aria-live="off">9:41 AM</span><button class="menulink" id="controlBtn" aria-label="Open quick settings">☷</button></div>
</header>
<div class="menu-pop" id="systemMenu" hidden><button data-open="about">✦ <span>Welcome to SkiOS</span></button><button data-open="finder">▦ <span>Open Finder</span></button><button data-open="settings">⚙ <span>System Settings</span></button><div class="menu-rule"></div><button id="lockBtn">◒ <span>Lock screen</span></button><button id="powerBtn">⏻ <span>Power options…</span></button></div>
<div class="menu-pop" id="controlMenu" style="left:auto;right:12px" hidden><button data-open="settings">⚙ <span>System Settings</span></button><button id="quickTheme">◐ <span>Switch appearance</span></button><button id="volumeBtn">♫ <span>Sound: on</span></button><button id="wifiBtn">⌁ <span>Wi-Fi: connected</span></button></div>
<main class="desktop" id="desktop">
 <section class="welcome"><div class="eyebrow">A little more you.</div><h1>Make yourself<br>at home.</h1><p>A calm, capable space for everything you want to do. Welcome to your desktop.</p><div class="date-line" id="longDate"></div></section>
 <div class="desktop-icons" aria-label="Desktop apps">
  <button class="desktop-icon" data-open="finder"><span class="app-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/><path d="M3 10h18"/></svg></span>Finder</button>
  <button class="desktop-icon" data-open="browser"><span class="app-icon mint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span>Browser</button>
  <button class="desktop-icon" data-open="notes"><span class="app-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>Notes</button>
  <button class="desktop-icon" data-open="settings"><span class="app-icon slate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="m19 13 2 1-2 4-2-1-2 1v2H9v-2l-2-1-2 1-2-4 2-1v-2l-2-1 2-4 2 1 2-1V4h6v2l2 1 2-1 2 4-2 1z"/></svg></span>Settings</button>
 </div>
</main>
<div class="dock-wrap"><nav class="dock" aria-label="App dock" id="dock">
 <button class="dock-btn" data-open="finder" aria-label="Open Finder"><span class="app-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/><path d="M3 10h18"/></svg></span><span>Finder</span></button>
 <button class="dock-btn" data-open="browser" aria-label="Open Browser"><span class="app-icon mint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span><span>Browser</span></button>
 <button class="dock-btn" data-open="notes" aria-label="Open Notes"><span class="app-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><span>Notes</span></button>
 <button class="dock-btn" data-open="calculator" aria-label="Open Calculator"><span class="app-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg></span><span>Calculator</span></button>
 <span class="dock-sep"></span>
 <button class="dock-btn" data-open="settings" aria-label="Open Settings"><span class="app-icon slate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="m19 13 2 1-2 4-2-1-2 1v2H9v-2l-2-1-2 1-2-4 2-1v-2l-2-1 2-4 2 1 2-1V4h6v2l2 1 2-1 2 4-2 1z"/></svg></span><span>Settings</span></button>
 <button class="dock-btn" data-open="about" aria-label="About SkiOS"><span class="app-icon pink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3 14.5 9.5 21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg></span><span>About</span></button>
</nav></div>
<section class="window" id="window" role="dialog" aria-modal="false" aria-labelledby="windowTitle" hidden>
 <header class="titlebar" id="titlebar"><div class="window-title"><span class="mini-icon blue" id="windowIcon">S</span><span id="windowTitle">Finder</span></div><div class="win-controls"><button id="minimizeBtn" aria-label="Minimize window" title="Minimize"></button><button id="closeBtn" aria-label="Close window" title="Close"></button><button id="maximizeBtn" aria-label="Maximize window" title="Maximize"></button></div></header>
 <div class="window-body" id="windowBody"></div>
</section>
<div class="toast" id="toast" role="status" hidden></div>
<div class="power-screen" id="powerScreen" hidden><div><div class="brand-mark" style="margin:auto;width:42px;height:42px;font-size:24px;border-radius:14px">S</div><h2 id="powerTitle">SkiOS is taking a pause.</h2><p class="subtle" style="color:#c4d2e4">Your browser desktop is safely paused.</p><button class="primary" id="wakeBtn">Return to desktop</button></div></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const windowEl=$('#window'), body=$('#windowBody'), title=$('#windowTitle'), icon=$('#windowIcon');
let activeApp=null, maximized=false, previousRect=null, z=100, toastTimer=null, dark=false, sound=true, wifi=true;
const icons={
finder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/><path d="M3 10h18"/></svg>',
browser:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>',
notes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
calculator:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>',
settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="m19 13 2 1-2 4-2-1-2 1v2H9v-2l-2-1-2 1-2-4 2-1v-2l-2-1 2-4 2 1 2-1V4h6v2l2 1 2-1 2 4-2 1z"/></svg>',
about:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3 14.5 9.5 21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg>'
};
const appMeta={
finder:{name:'Finder',color:'blue'},browser:{name:'Browser',color:'mint'},notes:{name:'Notes',color:'orange'},calculator:{name:'Calculator',color:'purple'},settings:{name:'System Settings',color:'slate'},about:{name:'About SkiOS',color:'pink'}
};
function notify(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2300)}
function closeMenus(){ $('#systemMenu').hidden=true;$('#controlMenu').hidden=true }
function openApp(app){
 if(!appMeta[app])app='about';closeMenus();activeApp=app;const meta=appMeta[app];title.textContent=meta.name;icon.className='mini-icon '+meta.color;icon.innerHTML=icons[app]||'S';body.innerHTML=renderApp(app);windowEl.hidden=false;windowEl.style.zIndex=++z;windowEl.style.left='50%';windowEl.style.top=app==='about'?'17%':'12%';windowEl.style.transform='translateX(-50%)';maximized=false;wireApp(app);document.querySelectorAll('.dock-btn').forEach(b=>{const dot=b.querySelector('.dot');if(dot)dot.remove();if(b.dataset.open===app){const d=document.createElement('i');d.className='dot';b.append(d)}});
}
function renderApp(app){
 if(app==='about')return '<div style="text-align:center;padding:18px 5px 25px"><div class="app-icon blue" style="width:68px;height:68px;border-radius:21px;margin:0 auto 16px;font-size:28px;font-weight:800">S</div><div class="eyebrow">A fresh take on desktop</div><h2 class="section-title" style="font-size:29px;margin:9px 0">Meet SkiOS.</h2><p class="subtle" style="max-width:410px;margin:0 auto 20px">A thoughtful, web-based desktop inspired by the clarity of macOS and the welcoming polish of Zorin OS. Designed to feel at home in your browser.</p><div class="settings-grid" style="text-align:left"><div class="settings-card"><h3>✦ Thoughtful design</h3><p class="subtle">Soft glass, considered spacing, and a desktop that stays out of your way.</p></div><div class="settings-card"><h3>⌘ Useful by default</h3><p class="subtle">Finder, Notes, Calculator, Browser, and quick settings are ready to explore.</p></div></div><p class="subtle" style="margin-top:20px">SkiOS Web Preview · Version 1.0</p></div>';
 if(app==='finder')return '<h2 class="section-title">Your space.</h2><p class="subtle">A simple home for your desktop essentials.</p><div class="search-shell"><span>⌕</span><input id="finderSearch" placeholder="Search apps…" aria-label="Search apps"></div><div class="search-results" id="finderResults"></div><div class="file-list"><div class="file-row"><span class="app-icon blue">'+icons.notes+'</span><div><b>Welcome to SkiOS.txt</b><small>Text document · Just now</small></div></div><div class="file-row"><span class="app-icon purple">'+icons.settings+'</span><div><b>System preferences</b><small>Settings · Available</small></div></div></div>';
 if(app==='notes')return '<div class="notes-toolbar"><span>QUICK NOTE · SAVED ON THIS DEVICE</span><button class="secondary" id="clearNote">Clear note</button></div><textarea class="note-area" id="noteText" placeholder="A thought, a plan, a little spark…"></textarea><div class="subtle" id="noteStatus">Your note saves automatically in this browser.</div>';
 if(app==='calculator')return '<div class="calc"><input class="calc-display" id="calcDisplay" value="0" aria-label="Calculator display" readonly><div class="calc-grid">'+['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','⌫','0','.','='].map((k,i)=>'<button data-key="'+k+'" class="'+([3,7,11,15].includes(i)?'op ':'')+(k==='='?'equal':'')+'">'+k+'</button>').join('')+'</div></div>';
 if(app==='settings')return '<h2 class="section-title">Make it yours.</h2><p class="subtle">Small touches, just the way you like them.</p><div class="settings-grid"><div class="settings-card"><h3>Appearance</h3><p class="subtle">Choose the mood for your desktop.</p><div class="swatches"><button class="swatch" data-wall="blue" style="background:linear-gradient(135deg,#d8e7f7,#8daee0)" aria-label="Blue wallpaper"></button><button class="swatch" data-wall="sunset" style="background:linear-gradient(135deg,#ffe2ce,#e9a8ad)" aria-label="Sunset wallpaper"></button><button class="swatch" data-wall="forest" style="background:linear-gradient(135deg,#d5eee0,#76b8a7)" aria-label="Forest wallpaper"></button><button class="swatch" data-wall="violet" style="background:linear-gradient(135deg,#e6defe,#9c9de0)" aria-label="Violet wallpaper"></button></div><div class="setting-line"><span>Dark appearance</span><button class="switch" id="darkSwitch" aria-label="Toggle dark appearance" aria-pressed="false"></button></div></div><div class="settings-card"><h3>Desktop</h3><p class="subtle">Keep your workspace comfortable.</p><div class="setting-line"><span>Show welcome message</span><button class="switch on" id="welcomeSwitch" aria-label="Toggle welcome message" aria-pressed="true"></button></div><div class="setting-line"><span>Reduce motion</span><button class="switch" id="motionSwitch" aria-label="Toggle reduced motion" aria-pressed="false"></button></div></div><div class="settings-card"><h3>System</h3><p class="subtle">SkiOS Web Preview · 1.0</p><button class="secondary" id="aboutFromSettings">About this OS</button></div></div>';
 if(app==='browser')return '<div class="browser-bar"><button class="secondary" id="browserBack" aria-label="Back">‹</button><input id="browserAddress" value="ski://home" aria-label="Address or search"><button class="primary" id="browserGo">Go</button></div><div class="browser-content" id="browserContent"><div class="browser-logo"><span>Ski</span>OS</div><p class="subtle" style="text-align:center">A little space to explore.</p><form class="search-shell" id="webSearch"><span>⌕</span><input id="webQuery" placeholder="Search the web…" aria-label="Search the web"><button class="primary" type="submit">Search</button></form><div class="browser-links"><button data-url="https://www.wikipedia.org">Wikipedia</button><button data-url="https://www.google.com">Google</button><button data-url="https://www.youtube.com">YouTube</button></div><p class="subtle" style="text-align:center;margin-top:24px">External websites open in a new browser tab. This preview does not embed the public web.</p></div>';
 return '';
}
function wireApp(app){
 if(app==='finder'){const list=$('#finderResults');const draw=q=>{list.innerHTML=Object.entries(appMeta).filter(([k,v])=>(k+' '+v.name).toLowerCase().includes(q.toLowerCase())).map(([k,v])=>'<button class="result-card" data-launch="'+k+'"><span class="app-icon '+v.color+'">'+icons[k]+'</span><b>'+v.name+'</b><small>Open app</small></button>').join('')||'<p class="subtle">No apps found.</p>';list.querySelectorAll('[data-launch]').forEach(b=>b.onclick=()=>openApp(b.dataset.launch))};draw('');$('#finderSearch').oninput=e=>draw(e.target.value)}
 if(app==='notes'){const n=$('#noteText');try{n.value=localStorage.getItem('skios-note')||''}catch(e){}n.oninput=()=>{try{localStorage.setItem('skios-note',n.value);$('#noteStatus').textContent='Saved just now.'}catch(e){$('#noteStatus').textContent='Storage is unavailable in this browser.'}};$('#clearNote').onclick=()=>{n.value='';n.dispatchEvent(new Event('input'));n.focus()}}
 if(app==='calculator'){let expr='',fresh=true;const d=$('#calcDisplay');body.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='AC'){expr='';d.value='0';fresh=true;return}if(k==='⌫'){expr=expr.slice(0,-1);d.value=expr||'0';return}if(k==='±'){if(expr&&!/[+−×÷]$/.test(expr))expr=expr.startsWith('−')?expr.slice(1):'−'+expr;d.value=expr||'0';return}if(k==='%'){const n=Number(expr);if(Number.isFinite(n)){expr=String(n/100);d.value=expr}return}if(k==='='){try{let safe=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!safe||!/^[0-9+*/.() -]+$/.test(safe))throw Error();let result=Function('"use strict";return ('+safe+')')();if(!Number.isFinite(result))throw Error();expr=String(Number(result.toPrecision(10)));d.value=expr;fresh=true}catch(e){d.value='Not possible';expr='';fresh=true}return}if(fresh&&!['+','−','×','÷'].includes(k)){expr='';fresh=false}if(['+','−','×','÷'].includes(k)&&!expr)return;if(['+','−','×','÷'].includes(k)&&/[+−×÷]$/.test(expr))expr=expr.slice(0,-1);expr+=k;d.value=expr||'0';fresh=false})}
 if(app==='settings'){body.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>setWall(b.dataset.wall));$('#darkSwitch').onclick=()=>setDark(!dark);$('#welcomeSwitch').onclick=()=>{const el=$('.welcome');el.hidden=!el.hidden;toggleButton($('#welcomeSwitch'),!el.hidden)};$('#motionSwitch').onclick=()=>{const on=$('#motionSwitch').classList.toggle('on');document.documentElement.style.setProperty('--motion',on?'0':'1');toggleButton($('#motionSwitch'),on);document.body.style.setProperty('animation-duration',on?'0.01ms':'')};$('#aboutFromSettings').onclick=()=>openApp('about')}
 if(app==='browser'){const address=$('#browserAddress');const go=()=>{let val=address.value.trim();if(!val)return;if(!/^[a-z]+:\/\//i.test(val)&&!val.includes('.')&&!val.includes(' ')){val='https://www.google.com/search?q='+encodeURIComponent(val)}else if(!/^[a-z]+:\/\//i.test(val)){val='https://'+val}try{const u=new URL(val);if(!['http:','https:'].includes(u.protocol))throw Error();window.open(u.href,'_blank','noopener,noreferrer')}catch(e){notify('Please enter a valid web address.')}};$('#browserGo').onclick=go;address.onkeydown=e=>{if(e.key==='Enter')go()};$('#webSearch').onsubmit=e=>{e.preventDefault();const q=$('#webQuery').value.trim();if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener,noreferrer')};body.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>window.open(b.dataset.url,'_blank','noopener,noreferrer'));$('#browserBack').onclick=()=>{address.value='ski://home';notify('Returned to Browser home.')}}
}
function toggleButton(el,on){el.classList.toggle('on',on);el.setAttribute('aria-pressed',String(on))}
function setWall(name){const w=$('#wallpaper');const styles={blue:['#d8e7f7','#b8d1ed','#8daee0'],sunset:['#ffe2ce','#f4c1c8','#d99bb5'],forest:['#d5eee0','#a8d7c5','#76b8a7'],violet:['#e6defe','#c6bff0','#9299dc']};const a=styles[name]||styles.blue;document.documentElement.style.setProperty('--wall1',a[0]);document.documentElement.style.setProperty('--wall2',a[1]);document.documentElement.style.setProperty('--wall3',a[2]);notify('Wallpaper updated.')}
function setDark(on){dark=on;document.documentElement.style.colorScheme=on?'dark':'light';document.documentElement.style.setProperty('--ink',on?'#edf3fc':'#182333');document.documentElement.style.setProperty('--muted',on?'#aab9ce':'#68778a');document.documentElement.style.setProperty('--glass',on?'rgba(26,37,54,.86)':'rgba(250,252,255,.76)');document.querySelectorAll('.window').forEach(w=>{w.style.background=on?'rgba(28,39,56,.92)':'rgba(250,252,255,.88)';w.style.color=on?'#edf3fc':''});document.querySelectorAll('.window-body .settings-card,.window-body .result-card,.window-body .file-row,.window-body .browser-content,.window-body .calc-display').forEach(e=>{e.style.background=on?'#26364b':' ';e.style.color=on?'#edf3fc':''});const s=$('#darkSwitch');if(s)toggleButton(s,on);notify(on?'Dark appearance enabled.':'Light appearance enabled.')}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.open)));
$('#systemMenuBtn').onclick=()=>{$('#controlMenu').hidden=true;$('#systemMenu').hidden=!$('#systemMenu').hidden};
$('#controlBtn').onclick=()=>{$('#systemMenu').hidden=true;$('#controlMenu').hidden=!$('#controlMenu').hidden};
document.addEventListener('click',e=>{if(!e.target.closest('#systemMenu')&&!e.target.closest('#systemMenuBtn')&&!e.target.closest('#controlMenu')&&!e.target.closest('#controlBtn'))closeMenus()});
$('#closeBtn').onclick=()=>{windowEl.hidden=true;activeApp=null};$('#minimizeBtn').onclick=()=>{windowEl.hidden=true;notify('Window minimized. Open the app from the dock to return.')};
$('#maximizeBtn').onclick=()=>{if(!maximized){previousRect={left:windowEl.style.left,top:windowEl.style.top,width:windowEl.style.width,height:windowEl.style.height,transform:windowEl.style.transform};windowEl.style.left='12px';windowEl.style.top='48px';windowEl.style.width='calc(100vw - 24px)';windowEl.style.height='calc(100dvh - 140px)';windowEl.style.transform='none';maximized=true}else{windowEl.style.left=previousRect?.left||'50%';windowEl.style.top=previousRect?.top||'12%';windowEl.style.width=previousRect?.width||'min(760px,calc(100vw - 30px))';windowEl.style.height=previousRect?.height||'min(540px,calc(100dvh - 150px))';windowEl.style.transform=previousRect?.transform||'translateX(-50%)';maximized=false}};
$('#quickTheme').onclick=()=>{closeMenus();setDark(!dark)};$('#volumeBtn').onclick=()=>{sound=!sound;$('#volumeBtn').lastElementChild.textContent='Sound: '+(sound?'on':'off');notify('Sound '+(sound?'enabled':'muted')+'.')};$('#wifiBtn').onclick=()=>{wifi=!wifi;$('#wifiBtn').lastElementChild.textContent='Wi-Fi: '+(wifi?'connected':'disconnected');notify(wifi?'Connection indicator enabled.':'Connection indicator disabled.')};
$('#lockBtn').onclick=()=>{$('#powerScreen').hidden=false;$('#powerTitle').textContent='SkiOS is locked.';closeMenus()};$('#powerBtn').onclick=()=>{$('#powerScreen').hidden=false;$('#powerTitle').textContent='SkiOS is taking a pause.';closeMenus()};$('#wakeBtn').onclick=()=>{$('#powerScreen').hidden=true;notify('Welcome back.')};
let drag=null;$('#titlebar').addEventListener('pointerdown',e=>{if(e.target.closest('.win-controls')||maximized)return;drag={x:e.clientX,y:e.clientY,left:windowEl.getBoundingClientRect().left,top:windowEl.getBoundingClientRect().top};$('#titlebar').setPointerCapture(e.pointerId)});$('#titlebar').addEventListener('pointermove',e=>{if(!drag)return;const left=Math.max(0,Math.min(innerWidth-windowEl.offsetWidth,drag.left+e.clientX-drag.x));const top=Math.max(38,Math.min(innerHeight-100,drag.top+e.clientY-drag.y));windowEl.style.left=left+'px';windowEl.style.top=top+'px';windowEl.style.transform='none'});$('#titlebar').addEventListener('pointerup',()=>drag=null);$('#titlebar').addEventListener('pointercancel',()=>drag=null);
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});$('#longDate').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});}
tick();setInterval(tick,15000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenus();if(!windowEl.hidden)windowEl.hidden=true}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openApp('finder');setTimeout(()=>$('#finderSearch')?.focus(),50)}});
})();
</script>
</body>
</html>
